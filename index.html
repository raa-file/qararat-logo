<style>
/* Layout: sticky top bar with section tabs; each section is one calm workspace with a result panel beside (desktop) or below (phone) */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface-2:#F6F9F8; --line:#D6E1DD;
  --ink:#1C2B28; --muted:#5D6E6A;
  --primary:#2E6F64; --primary-soft:#D7EAE5; --on-primary:#FFFFFF;
  --lilac:#7C6BB0; --lilac-soft:#E8E3F5;
  --apricot:#D9894A; --apricot-soft:#FBE9DA;
  --good:#2F8A55; --good-soft:#DDF1E4; --warn:#B7791F; --warn-soft:#FAEFD6; --bad:#C0483F; --bad-soft:#F8DEDB;
  --shadow:0 1px 2px rgba(28,43,40,.06),0 6px 20px rgba(28,43,40,.06);
  --f-display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A19; --surface:#1A2523; --surface-2:#16201E; --line:#2C3C38;
  --ink:#E4EEEB; --muted:#9CB0AB;
  --primary:#6FC1B1; --primary-soft:#1F3B36; --on-primary:#0E1A18;
  --lilac:#B4A6E6; --lilac-soft:#2A2640;
  --apricot:#F0AE78; --apricot-soft:#3A2A1E;
  --good:#6FD39A; --good-soft:#1C3527; --warn:#E8B85C; --warn-soft:#3A3020; --bad:#F08B82; --bad-soft:#3D2220;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A19; --surface:#1A2523; --surface-2:#16201E; --line:#2C3C38;
  --ink:#E4EEEB; --muted:#9CB0AB;
  --primary:#6FC1B1; --primary-soft:#1F3B36; --on-primary:#0E1A18;
  --lilac:#B4A6E6; --lilac-soft:#2A2640;
  --apricot:#F0AE78; --apricot-soft:#3A2A1E;
  --good:#6FD39A; --good-soft:#1C3527; --warn:#E8B85C; --warn-soft:#3A3020; --bad:#F08B82; --bad-soft:#3D2220;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--ink);text-decoration:none}
.brand svg{flex:none}
.me-chip{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13.5px}
.me-chip b{font-family:var(--f-display)}
.pts{background:var(--primary);color:var(--on-primary);border-radius:999px;padding:2px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;width:100%;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}

main{padding-block:26px 60px}
section[data-view]{display:grid;gap:22px}
.head{display:grid;gap:6px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--lilac)}
.head h2{font-size:clamp(22px,3.4vw,30px)}
.head p{color:var(--muted);max-width:62ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.plain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}

.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:700;background:var(--primary);color:var(--on-primary);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn.soft{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;width:100%}
.input:focus{border-color:var(--primary);outline:none}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:stretch}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-main{background:var(--primary);color:var(--on-primary);border-radius:20px;padding:30px 28px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero-main h1{font-size:clamp(28px,5vw,44px);font-weight:800}
.hero-main .slogan{font-family:var(--f-display);font-size:clamp(16px,2.2vw,20px);opacity:.92}
.hero-main p{opacity:.85;max-width:46ch}
.hero-main svg.fork{position:absolute;inset-inline-start:-10px;bottom:-14px;width:220px;opacity:.16;pointer-events:none}
.levelbar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.levelbar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--lilac));border-radius:99px;transition:width .6s}
.skills{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13.5px}
.skill .bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.skill .bar i{display:block;height:100%;border-radius:99px}
.skill span:last-child{text-align:left;font-variant-numeric:tabular-nums;color:var(--muted)}
.sec-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:920px){.sec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.sec-grid{grid-template-columns:minmax(0,1fr)}}
.sec{display:grid;gap:8px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:transform .2s,box-shadow .2s}
.sec:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.sec .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px}
.sec h3{font-size:16.5px}
.sec p{font-size:13.5px;color:var(--muted)}
.sec .st{font-size:12.5px;font-weight:600;color:var(--primary)}

/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
.c-need{background:var(--primary-soft);color:var(--primary)}
.c-want{background:var(--lilac-soft);color:var(--lilac)}
.c-good{background:var(--good-soft);color:var(--good)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.c-sample{background:var(--apricot-soft);color:var(--apricot)}

/* budget */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.items{grid-template-columns:minmax(0,1fr)}}
.item{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;text-align:right;transition:border-color .15s,background .15s}
.item .em{font-size:22px;flex:none}
.item .nm{flex:1;min-width:0;display:grid}
.item .nm b{font-weight:600;font-size:14.5px}
.item .pr{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.wallet{display:grid;gap:14px}
.wallet .big{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.stack i{display:block;height:100%;transition:width .4s}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px;background:var(--c)}
input[type=range]{width:100%;accent-color:var(--primary)}

/* result panel */
.result{display:grid;gap:10px;border-radius:var(--r);padding:18px;border:1.5px solid var(--line);background:var(--surface);animation:rise .45s ease}
.result h3{font-size:18px}
.result ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.result li{display:flex;gap:8px;font-size:14px}
.result li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:9px;background:var(--dot,var(--muted))}
.result li.ok{--dot:var(--good)} .result li.mid{--dot:var(--warn)} .result li.no{--dot:var(--bad)}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
@keyframes rise{from{opacity:.3;transform:translateY(10px)}to{opacity:1;transform:none}}

/* choices */
.scene{display:grid;gap:16px}
.scene .q{font-family:var(--f-display);font-size:clamp(18px,2.6vw,22px);font-weight:700}
.scene .ctx{color:var(--muted);font-size:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;transition:border-color .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--primary);transform:translateX(-3px)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.picked{border-color:var(--primary);background:var(--primary-soft)}
.opt:disabled{cursor:default}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:6px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--primary)} .dots i.cur{background:var(--lilac)}
.meters{display:flex;gap:8px;flex-wrap:wrap}
.path{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;font-size:14px}
.path .lbl{font-weight:700;color:var(--muted);font-size:12.5px;padding-top:2px}

/* kitchen */
.foods{display:grid;gap:14px}
.fgroup h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700}
.fgroup .row{gap:8px}
.food{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
.food .em{font-size:19px}
.food[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.food .tag{font-size:11px;color:var(--apricot);font-weight:700}
.plate-wrap{display:grid;place-items:center;gap:12px}
.plate{width:min(280px,100%);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 58%,var(--surface-2) 59% 100%);border:2px solid var(--line);position:relative;box-shadow:var(--shadow)}
.plate .on{position:absolute;font-size:34px;transform:translate(50%,-50%);animation:drop .35s ease}
.plate .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13.5px;text-align:center;padding:30%}
@keyframes drop{from{transform:translate(50%,-90%) scale(.6);opacity:0}to{transform:translate(50%,-50%) scale(1);opacity:1}}
.gchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.gchip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.gchip.has{border-style:solid;border-color:var(--good);color:var(--good);background:var(--good-soft)}

/* week */
.palette{display:flex;gap:8px;flex-wrap:wrap}
.blk{border:1.5px solid transparent;border-radius:10px;padding:6px 12px;font-size:13.5px;font-weight:600;background:var(--c-soft);color:var(--c)}
.blk[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 3px var(--c-soft)}
.week-scroll{overflow-x:auto}
.week{display:grid;grid-template-columns:72px repeat(7,minmax(78px,1fr));gap:6px;min-width:650px}
.week .dh{font-size:12.5px;font-weight:700;text-align:center;color:var(--muted);padding:4px 0}
.week .dh.test{color:var(--apricot)}
.week .sh{font-size:12px;color:var(--muted);display:flex;align-items:center}
.slot{min-height:46px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface-2);font-size:12.5px;font-weight:600;padding:4px;transition:background .15s}
.slot:hover{border-color:var(--primary)}
.slot.f{border-style:solid;border-color:transparent;background:var(--c-soft);color:var(--c)}
.t-study{--c:var(--primary);--c-soft:var(--primary-soft)}
.t-rest{--c:var(--lilac);--c-soft:var(--lilac-soft)}
.t-sport{--c:var(--good);--c-soft:var(--good-soft)}
.t-family{--c:var(--apricot);--c-soft:var(--apricot-soft)}
.t-screen{--c:var(--bad);--c-soft:var(--bad-soft)}
.t-hobby{--c:var(--warn);--c-soft:var(--warn-soft)}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:460px){.counts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cnt{border-radius:10px;padding:8px 10px;background:var(--c-soft);color:var(--c);font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.cnt b{font-variant-numeric:tabular-nums}

/* weekly */
.wk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.wk{grid-template-columns:minmax(0,1fr)}}
.wk-card{background:var(--lilac);color:#fff;border-radius:20px;padding:26px;display:grid;gap:12px;align-content:start}
:root[data-theme="dark"] .wk-card{color:#14121F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wk-card{color:#14121F}}
.wk-card h3{font-size:clamp(20px,3vw,26px)}
.wk-card .when{font-size:13px;opacity:.85}
.steps{margin:0;padding-inline-start:20px;display:grid;gap:4px}

/* teacher */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.hbar .tr{height:12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:99px}
.hbar b{text-align:left;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
th{font-size:12.5px;color:var(--muted);font-weight:700;background:var(--surface-2)}
td.n{font-variant-numeric:tabular-nums}
.done-dots{display:flex;gap:4px}
.done-dots i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.done-dots i.y{background:var(--primary)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 14px;display:grid;gap:8px;font-size:14px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;box-shadow:var(--shadow);animation:rise .3s ease;max-width:calc(100% - 32px);text-align:center}
.muted{color:var(--muted)}
.ico{width:1.25em;height:1.25em;flex:none;display:inline-block;vertical-align:-.25em}
.tab{display:inline-flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.sec .ic{color:var(--icc)}
.sec .ic .ico{width:26px;height:26px}
.tile span{display:flex;align-items:center;gap:6px}
.tile .ico,.result h3 .ico{color:var(--primary)}
.result h3{display:flex;align-items:center;gap:8px}
.pts{display:inline-flex;align-items:center;gap:4px}
.wk-card .ico{width:30px;height:30px}
.small{font-size:13px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

/* ========= state ========= */
function blankStudent(name,cls,sample){return {id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,cls,points:0,skills:{money:0,time:0,food:0,plan:0},done:{budget:0,choices:0,kitchen:0,week:0},weekly:[],sample:!!sample,joined:Date.now()}}
function load(){try{const r=JSON.parse(localStorage.getItem(LS));if(r&&r.students)return r}catch(e){}return {students:{},current:null,pin:'1234',seeded:false}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let S=load();
if(!S.seeded){
  const demo=[['نورة','ثاني متوسط',180,[2,1,1,1],[1]],['لمى','ثاني متوسط',95,[1,1,0,0],[]],['ريما','ثالث متوسط',320,[3,2,2,1],[1]],['جود','أول متوسط',40,[0,1,0,0],[]],['دانة','ثالث متوسط',260,[1,1,2,2],[1]],['شهد','أول متوسط',0,[0,0,0,0],[]]];
  demo.forEach(([n,c,p,d,w])=>{const s=blankStudent(n,c,true);s.points=p;s.done={budget:d[0],choices:d[1],kitchen:d[2],week:d[3]};s.skills={money:Math.min(100,d[0]*30),time:Math.min(100,d[1]*25+d[3]*15),food:Math.min(100,d[2]*35),plan:Math.min(100,d[3]*30+d[1]*10)};if(w.length)s.weekly=[weekKey()];S.students[s.id]=s});
  S.seeded=true;save();
}
let guest=blankStudent('ضيفة','',false);
function me(){return (S.current&&S.students[S.current])||guest}
function isGuest(){return me()===guest}
function level(p){let i=0;LEVELS.forEach((l,k)=>{if(p>=l[0])i=k});const cur=LEVELS[i],nxt=LEVELS[i+1];return {i,name:cur[1],next:nxt,pct:nxt?Math.round((p-cur[0])/(nxt[0]-cur[0])*100):100}}
function award(sec,skill,pts,gain){
  const s=me();const before=level(s.points).i;
  s.points+=pts;if(sec)s.done[sec]=(s.done[sec]||0)+1;
  if(skill)s.skills[skill]=Math.min(100,(s.skills[skill]||0)+gain);
  if(!isGuest())save();
  renderChip();
  const after=level(s.points).i;
  toast(after>before?`مستوى جديد: ${LEVELS[after][1]} · +${pts} نقطة`:`+${pts} نقطة`);
  if(isGuest())setTimeout(()=>toast('سجّلي اسمك من الرئيسية لتُحفظ نقاطك'),2200);
}
function weekKey(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+Math.ceil(((t-y)/864e5+1)/7)}
function weekIndex(){return parseInt(weekKey().split('W')[1],10)%WEEKLY.length}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const h=$('#toastHost');h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2400)}
function skillBars(s){return `<div class="skills">${Object.entries(SKILLS).map(([k,v])=>`<div class="skill"><span>${v.n}</span><div class="bar"><i style="width:${s.skills[k]||0}%;background:${v.c}"></i></div><span>${s.skills[k]||0}</span></div>`).join('')}</div>`}

function renderChip(){const s=me();const l=level(s.points);$('#meChip').innerHTML=`<span>${isGuest()?'ضيفة':esc(s.name)} · <span class="muted">${l.name}</span></span><span class="pts">${ic('Star','bold')}${s.points}</span>`}
function go(v){if(!VIEWS.some(x=>x[0]===v))v='home';view=v;try{history.replaceState(null,'','#'+v)}catch(e){}renderTabs();render();window.scrollTo({top:0,behavior:'smooth'})}

/* ========= budget ========= */
let B={sc:0,sel:new Set(),save:0,res:null};
function vBudget(){
  const sc=BUDGETS[B.sc];
  const spent=[...B.sel].reduce((a,i)=>a+sc.items[i].p,0);
  const needs=[...B.sel].filter(i=>sc.items[i].t==='need').reduce((a,i)=>a+sc.items[i].p,0);
  const wants=spent-needs;const left=sc.budget-spent-B.save;
  const pct=v=>Math.max(0,Math.min(100,v/sc.budget*100));
  $('#app').innerHTML=`<section data-view>
    <div class="head"><span class="eyebrow">القسم الأول · إدارة المال</span><h2>تحدي الميزانية</h2><p>${sc.ctx}</p></div>
    <div class="seg" role="group" aria-label="اختيار الموقف">${BUDGETS.map((b,i)=>`<button data-sc="${i}" aria-pressed="${i===B.sc}">${b.n}</button>`).join('')}</div>
    <div class="split">
      <div class="card" style="display:grid;gap:14px">
        <div class="row" style="justify-content:space-between"><h3 style="font-size:17px">ماذا ستشترين؟</h3><div class="row small"><span class="chip c-need">احتياج</span><span class="chip c-want">رغبة</span></div></div>
        <div class="items">${sc.items.map((it,i)=>`<button class="item" data-it="${i}" aria-pressed="${B.sel.has(i)}"><span class="em">${it.e}</span><span class="nm"><b>${it.n}</b><span class="chip ${it.t==='need'?'c-need':'c-want'}" style="justify-self:start">${it.t==='need'?'احتياج':'رغبة'}</span></span><span class="pr">${it.p} ر.س</span></button>`).join('')}</div>
        <div class="field"><label for="saveR">الادخار: <b style="color:var(--ink)">${B.save} ريال</b> (${Math.round(B.save/sc.budget*100)}٪ من الميزانية)</label><input type="range" id="saveR" min="0" max="${Math.round(sc.budget*.5)}" step="5" value="${B.save}"></div>
      </div>
      <div style="display:grid;gap:16px">
        <div class="card wallet">
          <span class="muted small">المتبقي من ${sc.budget} ريال</span>
          <span class="big" style="color:${left<0?'var(--bad)':'var(--ink)'}">${left} <span style="font-size:16px">ر.س</span></span>
          <div class="stack" aria-hidden="true"><i style="width:${pct(needs)}%;background:var(--primary)"></i><i style="width:${pct(wants)}%;background:var(--lilac)"></i><i style="width:${pct(B.save)}%;background:var(--apricot)"></i></div>
          <div class="legend"><span style="--c:var(--primary)">احتياجات ${needs}</span><span style="--c:var(--lilac)">رغبات ${wants}</span><span style="--c:var(--apricot)">ادخار ${B.save}</span></div>
          ${left<0?`<span class="chip c-bad">تجاوزتِ الميزانية بـ ${-left} ريال</span>`:''}
          <div class="row"><button class="btn" id="bCheck">${ic('TickSquare','bold')}اعتمدي قراري</button><button class="btn soft" id="bReset">ابدئي من جديد</button></div>
        </div>
        <div id="bRes">${B.res||''}</div>
      </div>
    </div></section>`;

function vKitchen(){
  const groups=new Set(K.sel.map(n=>foodIndex[n].g));

    <div class="split">

      <div style="display:grid;gap:16px">
        <div class="card plate-wrap">
          <div class="plate" aria-label="الطبق">${K.sel.length?pos.map(p=>`<span class="on" style="right:${p.x}%;top:${p.y}%" title="${p.n}">${foodIndex[p.n].e}</span>`).join(''):'<span class="empty">اضغطي على الأطعمة لإضافتها للطبق</span>'}</div>
          <div class="gchips">${FOODS.filter(g=>g.g!=='extra').map(g=>`<span class="gchip ${groups.has(g.g)?'has':''}">${g.gn}</span>`).join('')}</div>
          <span class="muted small">${K.sel.length} / 6 أصناف</span>
          <div class="row"><button class="btn" id="kCheck" ${K.sel.length<2?'disabled':''}>${ic('TickSquare','bold')}قيّمي وجبتي</button><button class="btn soft" id="kClear">إفراغ الطبق</button></div>
        </div>
        <div>${K.res||''}</div>
      </div>
    </div></section>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const n=b.dataset.f;if(K.sel.includes(n))K.sel=K.sel.filter(x=>x!==n);else{if(K.sel.length>=6){toast('الطبق ممتلئ: ستة أصناف تكفي وتقلّل الهدر');return}K.sel.push(n)}K.res=null;vKitchen()});
  $('#kClear').onclick=()=>{K={sel:[],res:null};vKitchen()};
  $('#kCheck').onclick=()=>{
    const core=CORE.filter(g=>groups.has(g)).length;

    if(junk.length)L.push(`<li class="${junk.length>1?'no':'mid'}">${junk.join(' و')}: ${junk.length>1?'كثيرة على وجبة واحدة':'لا بأس بها أحيانًا، وليس يوميًا'}.</li>`);

    const pts=Math.round(s/100*35);

    vKitchen();award('kitchen','food',pts,Math.round(s/4));
  };

    $('#app').innerHTML=`<section data-view><div class="head"><span class="eyebrow">للمعلمة</span><h2>لوحة المعلمة</h2><p>أدخلي الرمز لعرض مشاركة الطالبات ومهاراتهن. الرمز الافتراضي 1234، ويمكن تغييره من داخل اللوحة.</p></div>
      <form class="card" id="pinF" style="display:grid;gap:10px;max-width:360px"><div class="field"><label for="pin">رمز الدخول</label><input class="input" id="pin" type="password" inputmode="numeric" autocomplete="off"></div><button class="btn">${ic('Lock','bold')}دخول</button></form></section>`;
    $('#pinF').onsubmit=e=>{e.preventDefault();if($('#pin').value===S.pin){T.ok=true;vTeacher()}else toast('الرمز غير صحيح')};return;
  }
  let list=Object.values(S.students).filter(s=>T.showSample||!s.sample);
  if(T.cls)list=list.filter(s=>s.cls===T.cls);
  const n=list.length||1,wk=weekKey();
  const part=SECTIONS.map(x=>({n:x.n,v:Math.round(list.filter(s=>s.done[x.id]>0).length/n*100)}));
  const active=list.filter(s=>Object.values(s.done).some(v=>v>0)).length;
  const avgPts=Math.round(list.reduce((a,s)=>a+s.points,0)/n);
  const wkDone=list.filter(s=>s.weekly.includes(wk)).length;
  const sk=Object.entries(SKILLS).map(([k,v])=>({n:v.n,c:v.c,v:Math.round(list.reduce((a,s)=>a+(s.skills[k]||0),0)/n)}));
  const hasSample=Object.values(S.students).some(s=>s.sample);
  const classes=[...new Set(Object.values(S.students).map(s=>s.cls))];
  $('#app').innerHTML=`<section data-view>
    <div class="row" style="justify-content:space-between"><div class="head"><span class="eyebrow">للمعلمة</span><h2>لوحة المعلمة</h2></div>
      <div class="row"><select class="input" id="tCls" style="width:auto"><option value="">كل الصفوف</option>${classes.map(c=>`<option ${c===T.cls?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn soft" id="tLock">${ic('Lock','light')}قفل اللوحة</button></div></div>
    ${hasSample?`<div class="plain row small" style="justify-content:space-between"><span><span class="chip c-sample">بيانات تجريبية</span> تظهر أسماء تجريبية حتى تبدأ الطالبات بالتسجيل.</span><div class="row"><button class="btn soft" id="tToggle">${T.showSample?'إخفاؤها':'إظهارها'}</button><button class="btn soft" id="tDelS">حذفها نهائيًا</button></div></div>`:''}
    <div class="tiles">
      <div class="tile"><span>${ic('People','bulk')}عدد الطالبات</span><b>${list.length}</b></div>
      <div class="tile"><span>${ic('Activity','bulk')}نسبة المشاركة</span><b>${Math.round(active/n*100)}٪</b></div>
      <div class="tile"><span>${ic('Star','bulk')}متوسط النقاط</span><b>${avgPts}</b></div>
      <div class="tile"><span>${ic('TicketStar','bulk')}تحدي الأسبوع</span><b>${wkDone}</b></div>
    </div>
    <div class="two">
      <div class="card" style="display:grid;gap:14px"><h3 style="font-size:16px">المشاركة في كل قسم</h3><div class="hbars">${part.map(p=>`<div class="hbar"><span>${p.n}</span><div class="tr"><i style="width:${p.v}%;background:var(--primary)"></i></div><b>${p.v}٪</b></div>`).join('')}</div><p class="muted small">النسبة = طالبات أنجزن القسم مرة واحدة على الأقل.</p></div>
      <div class="card" style="display:grid;gap:14px"><h3 style="font-size:16px">متوسط المهارات المكتسبة</h3><div class="hbars">${sk.map(p=>`<div class="hbar"><span>${p.n}</span><div class="tr"><i style="width:${p.v}%;background:${p.c}"></i></div><b>${p.v}</b></div>`).join('')}</div><p class="muted small">من 100 لكل مهارة، وترتفع مع جودة القرارات لا عددها فقط.</p></div>
    </div>
    <div class="card" style="display:grid;gap:12px">
      <div class="row" style="justify-content:space-between"><h3 style="font-size:16px">الطالبات</h3><button class="btn soft" id="tCopy">${ic('Paper','light')}نسخ التقرير</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>الصف</th><th>النقاط</th><th>المستوى</th><th>الأقسام</th><th>تحدي الأسبوع</th></tr></thead><tbody>
      ${list.sort((a,b)=>b.points-a.points).map(s=>`<tr><td>${esc(s.name)} ${s.sample?'<span class="chip c-sample">تجريبي</span>':''}</td><td>${esc(s.cls)}</td><td class="n">${s.points}</td><td>${level(s.points).name}</td><td><div class="done-dots" title="${SECTIONS.map(x=>x.n+': '+(s.done[x.id]||0)).join(' · ')}">${SECTIONS.map(x=>`<i class="${s.done[x.id]?'y':''}"></i>`).join('')}</div></td><td>${s.weekly.includes(wk)?'<span class="chip c-good">أنجزته</span>':'<span class="muted small">لم يُنجز</span>'}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">لا توجد طالبات بعد.</td></tr>'}
      </tbody></table></div>
      <p class="muted small">المربعات بالترتيب: الميزانية، اختاري تصرفك، مطبخي الذكي، رتبي أسبوعك. البيانات محفوظة على هذا الجهاز.</p>
    </div>
    <div class="plain" style="display:grid;gap:12px">
      <h3 style="font-size:16px;display:flex;gap:8px;align-items:center">${ic('Setting','bulk')}الإعدادات</h3>
      <form class="row" id="pinC"><div class="field"><label for="npin">رمز جديد للوحة</label><input class="input" id="npin" inputmode="numeric" maxlength="8" style="width:160px"></div><button class="btn soft" style="align-self:end">حفظ الرمز</button></form>
      ${T.confirm==='all'?`<div class="confirm"><b>سيُحذف كل شيء: الطالبات والنقاط والتحديات. لا يمكن التراجع.</b><div class="row"><button class="btn danger" id="tYes">نعم، احذفي الكل</button><button class="btn soft" id="tNo">إلغاء</button></div></div>`:`<button class="btn soft" id="tWipe" style="justify-self:start;color:var(--bad)">${ic('Delete','light')}مسح كل البيانات</button>`}
    </div></section>`;
  $('#tCls').onchange=e=>{T.cls=e.target.value;vTeacher()};
  $('#tLock').onclick=()=>{T.ok=false;vTeacher()};
  const tg=$('#tToggle');if(tg)tg.onclick=()=>{T.showSample=!T.showSample;vTeacher()};
  const ds=$('#tDelS');if(ds)ds.onclick=()=>{Object.keys(S.students).forEach(k=>{if(S.students[k].sample)delete S.students[k]});save();toast('حُذفت البيانات التجريبية');vTeacher()};
  $('#pinC').onsubmit=e=>{e.preventDefault();const v=$('#npin').value.trim();if(v.length<4){toast('الرمز 4 أرقام على الأقل');return}S.pin=v;save();toast('حُفظ الرمز الجديد');vTeacher()};
  const w=$('#tWipe');if(w)w.onclick=()=>{T.confirm='all';vTeacher()};
  const y=$('#tYes');if(y)y.onclick=()=>{S={students:{},current:null,pin:S.pin,seeded:true};save();T.confirm=null;renderChip();toast('مُسحت البيانات');vTeacher()};
  const no=$('#tNo');if(no)no.onclick=()=>{T.confirm=null;vTeacher()};
  $('#tCopy').onclick=()=>{
    const txt=['تقرير مبادرة «قرارات تصنع حياتي» · '+new Date().toLocaleDateString('ar-SA'),`عدد الطالبات: ${list.length} · المشاركة: ${Math.round(active/n*100)}٪ · متوسط النقاط: ${avgPts}`,'',...part.map(p=>`${p.n}: ${p.v}٪`),'',...list.map(s=>`${s.name} (${s.cls}) — ${s.points} نقطة — ${level(s.points).name}`)].join('\n');
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('نُسخ التقرير'),()=>toast('تعذّر النسخ من هذا المتصفح'));else toast('تعذّر النسخ من هذا المتصفح');
  };
}

/* ========= boot ========= */
renderChip();
const h=(location.hash||'').slice(1);
view=VIEWS.some(v=>v[0]===h)?h:'home';
renderTabs();render();
</script>
